name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Run the unit tests
        run: node test-node.js
      - name: Check the built ZIP with the system unzip
        run: |
          node -e 'const E=require("./export-kit.js");require("fs").writeFileSync("out.zip",Buffer.from(E.zip([{name:"a.txt",data:"hello"},{name:"b.json",data:JSON.stringify({ok:true})}])));'
          unzip -t out.zip
